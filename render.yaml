# Render.com service definition for the SnapLoad API.
services:
  - type: web
    name: snapload-api
    env: node
    plan: free
    buildCommand: npm install && pip3 install yt-dlp
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_KEY
        generateValue: true

# Render.com service definition for the SnapLoad API.
services:
  - type: web
    name: snapload-api
    env: node
    plan: free
    buildCommand: python3 -m pip install --user --upgrade yt-dlp && npm install --omit=dev
    startCommand: export PATH="$HOME/.local/bin:$PATH" && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_KEY
        generateValue: true

services:
  - type: web
    name: snapload-api
    runtime: node
    plan: free
    buildCommand: >
      npm install &&
      curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp
      -o /opt/render/project/src/yt-dlp &&
      chmod +x /opt/render/project/src/yt-dlp &&
      apt-get install -y ffmpeg
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_KEY
        generateValue: true
      - key: YTDLP_BINARY
        value: /opt/render/project/src/yt-dlp
